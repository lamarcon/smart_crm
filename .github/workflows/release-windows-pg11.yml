name: Release Windows PostgreSQL 11 bundle

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: smartcrm
          POSTGRES_PASSWORD: smartcrm_local_dev
          POSTGRES_DB: smartcrm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartcrm -d smartcrm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pinned toolchains and dependencies
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev]"
          corepack enable
          corepack prepare pnpm@10.18.3 --activate
          pnpm install --frozen-lockfile

      - name: Verify tag matches the application version
        shell: pwsh
        run: |
          $appVersion = (& python -c "from app.version import APP_VERSION; print(APP_VERSION)").Trim()
          $expectedTag = "v$appVersion"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
              throw "Tag $env:GITHUB_REF_NAME does not match application version $expectedTag."
          }

      - name: Run backend tests with PostgreSQL
        run: >-
          python -m pytest -q
          --ignore=tests/backend/test_github_release_delivery.py
          --ignore=tests/backend/test_manual_windows_pg11_outcomes.py

      - name: Run UI tests
        run: pnpm test

  release:
    needs: quality
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Run Windows deployment tests
        shell: pwsh
        run: >-
          python -m pytest -q
          tests/backend/test_github_release_delivery.py
          tests/backend/test_manual_windows_pg11_deployment.py
          tests/backend/test_manual_windows_pg11_outcomes.py

      - name: Build and verify the offline bundle
        shell: pwsh
        run: |
          python scripts/build_manual_windows_pg11_bundle.py --version $env:GITHUB_REF_NAME
          $zip = "dist/smart-crm-manual-pg11-$env:GITHUB_REF_NAME.zip"
          python scripts/verify_manual_windows_pg11_deployment.py --bundle $zip

      - name: Publish the immutable release assets
        shell: pwsh
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
              throw "Release $env:GITHUB_REF_NAME already exists and will not be overwritten."
          }
          $zip = "dist/smart-crm-manual-pg11-$env:GITHUB_REF_NAME.zip"
          $digest = "$zip.sha256"
          gh release create $env:GITHUB_REF_NAME `
              $zip `
              $digest `
              --verify-tag `
              --generate-notes `
              --title "Smart CRM $env:GITHUB_REF_NAME"
