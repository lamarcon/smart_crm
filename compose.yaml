name: smart-crm-demo

services:
  crm:
    build:
      context: .
    image: smart-crm-demo:local
    init: true
    command:
      - sh
      - -c
      - >-
        alembic upgrade head &&
        exec uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000
    environment:
      SMART_CRM_DATABASE_URL: "postgresql+psycopg://${SMART_CRM_DB_USER:-smartcrm}:${SMART_CRM_DB_PASSWORD:-smartcrm_local_dev}@postgres:5432/${SMART_CRM_DB_NAME:-smartcrm_test}?connect_timeout=2&tcp_user_timeout=2000"
      SMART_CRM_TEST_MODE: "0"
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    ports:
      - "${SMART_CRM_PORT:-8080}:8000"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "${SMART_CRM_DB_NAME:-smartcrm_test}"
      POSTGRES_USER: "${SMART_CRM_DB_USER:-smartcrm}"
      POSTGRES_PASSWORD: "${SMART_CRM_DB_PASSWORD:-smartcrm_local_dev}"
    ports:
      - "127.0.0.1:${SMART_CRM_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
    name: smart-crm-demo-postgres-data
