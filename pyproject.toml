[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-crm-demo"
version = "0.2.0"
description = "Smart CRM local API and PostgreSQL persistence runtime"
requires-python = ">=3.11,<3.13"
dependencies = [
  "alembic==1.16.5",
  "fastapi==0.116.1",
  "psycopg[binary]==3.2.9",
  "sqlalchemy==2.0.43",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
addopts = "--strict-markers"
